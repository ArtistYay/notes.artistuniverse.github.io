name: Build GitHub Pages
on:
  push:
    branches:
      - main
#    paths:
#      - 'notes-mkdocs/**'
  workflow_dispatch:

# Default to read-only; each job asks for only what it needs
permissions:
  contents: read

jobs:
  build_mkdocs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-deploy pushes to the gh-pages branch

    steps:
      # Actions are pinned to commit SHAs so a moved tag can't swap in different code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hooks/archive.py reads git history; a shallow clone makes every page look new
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material==9.8.0
      - run: mkdocs gh-deploy --config-file notes-mkdocs/mkdocs.yml --force

#      - name: Install MkDocs and plugins
#        run: |
#          pip install mkdocs-material mkdocs-obsidian

      - name: Build MkDocs site
        run: |
          mkdocs build --config-file notes-mkdocs/mkdocs.yml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: notes-mkdocs/site

  deploy_mkdocs:
      runs-on: ubuntu-latest
      needs: build_mkdocs
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

